<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web IDE</title>
    <!-- Inlined as a data URI rather than a file in public/: the module is
         served from inside a jar and must work air-gapped, so an extra asset
         is one more thing that can 404 in a mount that was packaged wrong.
         There was no favicon at all until 1.8.5 and the tab showed Chrome's
         default document glyph (Nigel, 03/09/2026). -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%231a1233%22%2F%3E%3Cpath%20d%3D%22M9%2011l5%205-5%205%22%20fill%3D%22none%22%20stroke%3D%22%2318baad%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M17%2022h7%22%20fill%3D%22none%22%20stroke%3D%22%2318baad%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E" />
    <script>
      // Paint the theme before first paint, so the shell never flashes light.
      // Wrapped because localStorage throws outright in some embedded contexts.
      (function () {
        try {
          var stored = localStorage.getItem('scriptide.theme');
          if (stored) { document.documentElement.setAttribute('data-theme', stored); }
        } catch (e) { /* storage unavailable — fall through to the CSS default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
