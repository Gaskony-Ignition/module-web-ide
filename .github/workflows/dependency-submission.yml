name: Dependency submission

# Dependabot can't read Gradle files, so this resolves the Gradle dependencies
# and submits them to the dependency graph; Java alerts then arrive like npm ones.
on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle.kts'
      - 'gradle/**'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
